<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chippy</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Chippy</h1>
    <p class="meta">API: <code id="api-url">…</code></p>
  </header>

  <main>
    <section>
      <h2>Status</h2>
      <p id="health" class="status">Checking…</p>
      <button type="button" id="btn-validate">Validate chain</button>
      <p id="validate-msg" class="msg"></p>
    </section>

    <section>
      <h2>Keygen</h2>
      <p class="hint">Ed25519 keypair in the browser (Web Crypto). Secret stays local; same format as <code>chippy keygen</code>.</p>
      <button type="button" id="btn-keygen">Generate keypair</button>
      <label>Address <input id="wallet-addr" type="text" readonly placeholder="64 hex"></label>
      <label>Secret <input id="wallet-secret" type="text" size="72" placeholder="128 hex (paste or generate)"></label>
      <button type="button" id="btn-load-wallet">Use pasted secret</button>
      <p id="keygen-msg" class="msg"></p>
    </section>

    <section>
      <h2>Balance</h2>
      <label>Address <input id="balance-addr" type="text" size="72" placeholder="64 hex chars"></label>
      <button type="button" id="btn-balance">Look up</button>
      <p id="balance-msg" class="msg"></p>
    </section>

    <section>
      <h2>Mint</h2>
      <p class="hint">Put the <strong>mint authority</strong> secret in Keygen above (not the recipient). Server must have <code>mint-key add</code> for that mint address.</p>
      <label>To <input id="mint-to" type="text" size="72"></label>
      <label>Amount <input id="mint-amount" type="number" min="1" step="1"></label>
      <label>Signature <input id="mint-sig" type="text" size="72" placeholder="128 hex"></label>
      <button type="button" id="btn-sign-mint">Sign mint</button>
      <button type="button" id="btn-mint">Submit mint</button>
      <p id="mint-msg" class="msg"></p>
    </section>

    <section>
      <h2>Transfer</h2>
      <label>From <input id="xfer-from" type="text" size="72"></label>
      <label>To <input id="xfer-to" type="text" size="72"></label>
      <label>Amount <input id="xfer-amount" type="number" min="1" step="1"></label>
      <label>Signature <input id="xfer-sig" type="text" size="72" placeholder="128 hex"></label>
      <button type="button" id="btn-sign-transfer">Sign transfer</button>
      <button type="button" id="btn-fill-from">Fill from → wallet address</button>
      <button type="button" id="btn-transfer">Submit transfer</button>
      <p id="xfer-msg" class="msg"></p>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/crypto.js"></script>
  <script src="/app.js"></script>
</body>
</html>
